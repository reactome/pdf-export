name: pdf-export ci

on:
    workflow_dispatch:
    pull_request:
        types:
            - opened
            - synchronize
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    # Every file as Prettier writes it (.prettierrc).
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Formatted
              run: npx --yes prettier@3.9.10 --check .

    # The code's gates (spec 001 T001): types, lint and the unit tests, on Node 24's own
    # type stripping.
    check:
        runs-on: ubuntu-latest
        # The fixture graph (ci/fixture), which the graph tests read
        services:
            neo4j:
                image: neo4j:4.4.48-community
                env:
                    NEO4J_AUTH: none
                    NEO4J_dbms_default__database: graph.db
                ports:
                    - 7687:7687
                options: >-
                    --health-cmd "cypher-shell -d graph.db 'RETURN 1'"
                    --health-interval 5s --health-timeout 10s --health-retries 30
        env:
            NEO4J_URI: bolt://localhost:7687
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm

            - run: npm ci

            # Chromium's headless shell, for the layout's print tests (T018)
            - name: Chromium
              run: npx playwright-core install --with-deps --only-shell chromium

            - name: Load the fixture graph
              run: |
                  docker cp ci/fixture/fixture.cypher ${{ job.services.neo4j.id }}:/fixture.cypher
                  docker exec ${{ job.services.neo4j.id }} cypher-shell -d graph.db -f /fixture.cypher

            - name: Types
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm test

            # Every installed package's licence, and every shipped font's licence file
            # (T002, FR-009, constitution II).
            - name: Licences
              run: node ci/licences.ts
